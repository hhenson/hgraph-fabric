name: Package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - name: Install built wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -m pip install 'hgraph-fabric[hgraph,kafka,nats]'
      - name: Smoke test installed package
        run: python -I -c "import hgraph_fabric"
      - name: Test installed package
        run: python -I -m unittest discover -s tests

  brokers:
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:4.1.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      nats:
        image: nats:2.11
        ports:
          - 4222:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[kafka,nats]'
      - name: Test real notification brokers
        env:
          HGRAPH_FABRIC_KAFKA: 127.0.0.1:9092
          HGRAPH_FABRIC_NATS: nats://127.0.0.1:4222
        run: python -I -m unittest discover -s tests -p test_notification_brokers.py -v
